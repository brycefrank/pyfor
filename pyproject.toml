[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfor"
dynamic = ["version"]
authors = [{ name = "Bryce Frank", email = "bfrank70@gmail.com" }]
description = "Tools for forest resource point cloud analysis."
readme = "README.md"
license = { file = "License.txt" }
requires-python = ">=3.10"
keywords = ["lidar", "point cloud", "forestry", "las", "laz"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.8",
    "laspy>=2.3",
    "lazrs>=0.5",
    "plyfile>=1.0",
    "shapely>=2.0",
    "geopandas>=0.14",
    "rasterio>=1.3",
    "joblib>=1.2",
]

[project.optional-dependencies]
plot = ["pyqtgraph>=0.13", "PyOpenGL"]
test = ["pytest>=7"]
docs = ["griffe>=2,<3"]

[project.urls]
Homepage = "https://github.com/brycefrank/pyfor"
Documentation = "https://brycefrank.com/pyfor"
Changelog = "https://github.com/brycefrank/pyfor/blob/master/CHANGELOG.md"

[tool.setuptools]
packages = ["pyfor", "pyfortest"]

[tool.setuptools.dynamic]
version = { attr = "pyfor.__version__" }

[tool.pytest.ini_options]
testpaths = ["pyfortest"]
